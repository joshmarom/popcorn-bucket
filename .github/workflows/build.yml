name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['server/**', 'docs/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['server/**', 'docs/**', '**/*.md']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm 12 (bundled with newer Node 24) rejects this lockfile's missing optional deps and its
      # remote tarball entries; stay on the npm major the lockfile is written with.
      - name: Install
        run: |
          npm install -g npm@11
          npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npx vitest run
