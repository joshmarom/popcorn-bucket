name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['server/**', 'docs/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['server/**', 'docs/**', '**/*.md']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm 12 (bundled with newer Node 24) refuses the lockfile's remote tarball entries; stay on
      # the npm major the lockfile is written with.
      - name: Install
        run: |
          npm install -g npm@11
          npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npx vitest run

  # Packaged on Windows so better-sqlite3 is the Windows build. Unsigned: SmartScreen warns.
  # windows-latest is Visual Studio 2026 (v18). The node-gyp used to build better-sqlite3
  # does not recognize it ("unknown version undefined"), so stay on the 2022 image (VS 2022).
  package-windows:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        shell: bash
        run: |
          npm install -g npm@11
          npm ci

      - name: Package Windows installer
        shell: bash
        run: npm run build:win -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: popcorn-bucket-windows
          path: dist/*.exe
          if-no-files-found: error
