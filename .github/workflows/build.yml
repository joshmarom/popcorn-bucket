name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['server/**', 'docs/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['server/**', 'docs/**', '**/*.md']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npx vitest run
