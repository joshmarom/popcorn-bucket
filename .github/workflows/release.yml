name: Release installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach installers to
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  package-windows:
    if: github.event_name == 'release'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        shell: bash
        run: |
          npm install -g npm@11
          npm ci

      - name: Package Windows installer
        shell: bash
        run: npm run build:win -- --publish never

      - name: Upload installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.exe --clobber

  package-macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: |
          npm install -g npm@11
          npm ci

      - name: Package macOS disk image
        run: npm run build:mac -- --universal --publish never -c.npmRebuild=true

      - name: Upload disk image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.dmg --clobber
